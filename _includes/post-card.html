<article class="post-card">
  <a class="post-card__link" href="{{ include.post.url | relative_url }}">
    <img src="{{ include.post.image | default: '/assets/images/default-cover.svg' | relative_url }}" alt="{{ include.post.image_alt | default: include.post.title | escape }}" loading="lazy">
    <div class="post-card__body"><p class="eyebrow">{{ include.post.categories | first | default: "ARTICLE" }}</p><h3>{{ include.post.title }}</h3><p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 135 }}</p><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time></div>
  </a>
</article>
